services:
  mongo:
    image: mongo:8
    container_name: rps-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rps
      MONGO_INITDB_ROOT_PASSWORD: rps-password
      MONGO_INITDB_DATABASE: rockpaperscissors
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: rps-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rps
      POSTGRES_PASSWORD: rps-password
      POSTGRES_DB: rockpaperscissors
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps -d rockpaperscissors"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  postgres-data:
